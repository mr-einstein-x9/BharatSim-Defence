name: CI - Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: opresponse/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: opresponse

    - name: Build project
      run: npm run build
      working-directory: opresponse

    - name: Run unit tests
      run: npm test
      working-directory: opresponse
